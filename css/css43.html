<!DOCTYPE html>
<html>
<head>
    <title>CSS Filters</title>

    <style>
        .image {
            width: 200px;
            margin: 10px;
        }

        .blur {
            filter: blur(5px);
        }

        .gray {
            filter: grayscale(100%);
        }

        .bright {
            filter: brightness(150%);
        }

        .contrast {
            filter: contrast(200%);
        }
    </style>
</head>

<body>

    <h2>CSS Filters</h2>

    <img class="image blur" src="https://picsum.photos/200/150">
    <img class="image gray" src="https://picsum.photos/200/150">
    <img class="image bright" src="https://picsum.photos/200/150">
    <img class="image contrast" src="https://picsum.photos/200/150">

</body>
</html>
