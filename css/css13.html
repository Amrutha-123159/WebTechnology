<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 13</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eff6ff, #f0fdf4);
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(700px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.12);
      padding: 30px;
    }
    h1 { text-align: center; color: #0f766e; }
    form {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }
    input, button {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
    }
    button {
      background: #0f766e;
      color: white;
      border: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 13</h1>
    <form>
      <input type="text" placeholder="Full Name" />
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <button>Register</button>
    </form>
  </div>
</body>
</html>
