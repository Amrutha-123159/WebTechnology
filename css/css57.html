<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>

    <style>
        .products {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product {
            width: 200px;
            padding: 20px;
            border: 1px solid gray;
            text-align: center;
        }

        img {
            width: 100%;
        }

        button {
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Online Store</h1>

    <div class="products">

        <div class="product">
            <img src="https://picsum.photos/200/150?1">
            <h3>Product 1</h3>
            <p>₹500</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/200/150?2">
            <h3>Product 2</h3>
            <p>₹800</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
