<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 16</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(760px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.12);
      padding: 30px;
    }
    h1 { text-align: center; color: #1d4ed8; }
    .demo {
      padding: 20px;
      background: #dbeafe;
      border-radius: 12px;
      border: 2px solid #93c5fd;
    }
    @media (max-width: 600px) {
      .demo { background: #e0f2fe; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 16</h1>
    <div class="demo">
      <p>This section changes layout on smaller screens using media queries.</p>
    </div>
  </div>
</body>
</html>
