<!DOCTYPE html>
<html>
<head>
    <title>Three Column Layout</title>

    <style>
        .container {
            display: flex;
            gap: 10px;
        }

        .column {
            flex: 1;
            padding: 30px;
            background-color: lightblue;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Three Column Layout</h2>

    <div class="container">
        <div class="column">Column 1</div>
        <div class="column">Column 2</div>
        <div class="column">Column 3</div>
    </div>

</body>
</html>
