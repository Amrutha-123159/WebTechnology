<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 38</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(760px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.08);
      padding: 28px;
    }
    h1 { text-align: center; color: #2563eb; }
    .demo {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .visible, .hidden-box {
      padding: 14px 18px;
      border-radius: 10px;
      background: #dbeafe;
      font-weight: 700;
    }
    .hidden-box { visibility: hidden; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 38</h1>
    <div class="demo">
      <div class="visible">Visible</div>
      <div class="hidden-box">Hidden</div>
    </div>
  </div>
</body>
</html>
