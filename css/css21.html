<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 21</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ecfeff;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(700px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(8, 145, 178, 0.12);
      padding: 24px;
      text-align: center;
    }
    h1 { color: #0f766e; }
    img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 21</h1>
    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=300&q=80" alt="Student" />
    <h2>Student Name</h2>
    <p>Computer Science Student</p>
  </div>
</body>
</html>
