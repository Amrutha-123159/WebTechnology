<!DOCTYPE html>
<html>
<head>
    <title>Sticky Header</title>

    <style>
        header {
            position: sticky;
            top: 0;
            background-color: black;
            color: white;
            padding: 20px;
        }

        .content {
            height: 1000px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h2>My Website</h2>
    </header>

    <div class="content">
        <h3>Scroll Down</h3>
        <p>This header stays at the top.</p>
    </div>

</body>
</html>
