<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 32</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(760px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.1);
      padding: 30px;
      text-align: center;
    }
    h1 { color: #1d4ed8; }
    .shadow-box {
      margin-top: 18px;
      background: #dbeafe;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
      font-weight: 700;
    }
    .shadow-text {
      margin-top: 18px;
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 2px 2px 8px rgba(37, 99, 235, 0.5);
      color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 32</h1>
    <div class="shadow-box">Box Shadow</div>
    <div class="shadow-text">Text Shadow</div>
  </div>
</body>
</html>
