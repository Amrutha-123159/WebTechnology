<!DOCTYPE html>
<html>
<head>
    <title>Fixed Sidebar</title>

    <style>
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100%;
            background-color: black;
            color: white;
            padding: 20px;
        }

        .content {
            margin-left: 240px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h3>Menu</h3>
        <p>Home</p>
        <p>About</p>
        <p>Contact</p>
    </div>

    <div class="content">
        <h2>Fixed Sidebar</h2>
        <p>This is the main content.</p>
    </div>

</body>
</html>
