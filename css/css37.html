<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 37</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(760px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.08);
      padding: 28px;
    }
    h1 { text-align: center; color: #1d4ed8; }
    .demo {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .demo span {
      border: 1px solid #cbd5e1;
      padding: 10px 14px;
      background: #e0f2fe;
    }
    .block { display: block; }
    .inline { display: inline; }
    .inline-block { display: inline-block; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 37</h1>
    <div class="demo">
      <span class="block">Block</span>
      <span class="inline">Inline</span>
      <span class="inline-block">Inline Block</span>
      <span class="hidden">Hidden</span>
    </div>
  </div>
</body>
</html>
