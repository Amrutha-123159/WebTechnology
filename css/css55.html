<!DOCTYPE html>
<html>
<head>
    <title>College Website</title>

    <style>
        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: lightblue;
            padding: 15px;
            text-align: center;
        }

        nav a {
            margin: 15px;
        }

        .content {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .box {
            flex: 1;
            padding: 20px;
            background-color: lightgray;
        }

        @media (max-width: 600px) {
            .content {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>ABC College</h1>
        <p>Education for a Better Future</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">
        <div class="box">
            <h2>Courses</h2>
            <p>BCA, B.Sc, B.Com</p>
        </div>

        <div class="box">
            <h2>About</h2>
            <p>Welcome to ABC College.</p>
        </div>
    </div>

</body>
</html>
