<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 26</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(720px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.08);
      padding: 28px;
    }
    h1 { text-align: center; color: #7c3aed; }
    .base {
      color: black;
      font-weight: normal;
    }
    .special {
      color: #7c3aed;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 26</h1>
    <p class="base">This text inherits base styles.</p>
    <p class="special">This text has higher specificity.</p>
  </div>
</body>
</html>
