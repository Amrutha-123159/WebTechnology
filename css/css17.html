<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 17</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f3ff;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(680px, 90vw);
      background: white;
      border-radius: 20px;
      box-shadow: 0 18px 30px rgba(109, 40, 217, 0.12);
      padding: 30px;
      text-align: center;
    }
    h1 { color: #7c3aed; }
    button {
      margin-top: 16px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      cursor: pointer;
      transition: transform 0.3s ease, background 0.3s ease;
    }
    button:hover {
      background: #6d28d9;
      transform: translateY(-4px) scale(1.04);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 17</h1>
    <button>Hover Me</button>
  </div>
</body>
</html>
