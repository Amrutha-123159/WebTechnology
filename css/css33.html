<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 33</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(760px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.08);
      padding: 28px;
      text-align: center;
    }
    h1 { color: #2563eb; }
    .shapes {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .shape {
      display: grid;
      place-items: center;
      width: 100px;
      height: 100px;
      background: #bfdbfe;
      color: #1e3a8a;
      font-weight: 700;
    }
    .circle { border-radius: 50%; }
    .pill { width: 140px; border-radius: 999px; }
    .rounded { border-radius: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 33</h1>
    <div class="shapes">
      <div class="shape circle">Circle</div>
      <div class="shape pill">Pill</div>
      <div class="shape rounded">Rounded</div>
    </div>
  </div>
</body>
</html>
