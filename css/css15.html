<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 15</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef2ff;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(760px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 35px rgba(99, 102, 241, 0.12);
      padding: 30px;
    }
    h1 { text-align: center; color: #4f46e5; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .box {
      background: #c7d2fe;
      border-radius: 10px;
      min-height: 90px;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #312e81;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 15</h1>
    <div class="grid">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
    </div>
  </div>
</body>
</html>
