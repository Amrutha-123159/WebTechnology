<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 34</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(760px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.08);
      padding: 28px;
      text-align: center;
    }
    h1 { color: #1d4ed8; }
    .demo {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .box {
      width: 160px;
      height: 100px;
      display: grid;
      place-items: center;
      font-weight: 700;
      border-radius: 12px;
      color: white;
      background: #1d4ed8;
    }
    .translucent { opacity: 0.4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 34</h1>
    <div class="demo">
      <div class="box">Opaque</div>
      <div class="box translucent">Transparent</div>
    </div>
  </div>
</body>
</html>
