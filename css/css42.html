<!DOCTYPE html>
<html>
<head>
    <title>Button Hover Animation</title>

    <style>
        button {
            padding: 15px 30px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.4s;
        }

        button:hover {
            background-color: green;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <h2>Button Hover Animation</h2>

    <button>Hover Me</button>

</body>
</html>
