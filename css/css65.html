<!DOCTYPE html>
<html>
<head>
    <title>CSS Transitions</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background-color: blue;
            transition: 1s;
        }

        .box:hover {
            width: 300px;
            background-color: green;
        }
    </style>
</head>

<body>

    <h2>CSS Transition</h2>

    <div class="box"></div>

</body>
</html>
