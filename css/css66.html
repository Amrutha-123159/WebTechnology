<!DOCTYPE html>
<html>
<head>
    <title>CSS Transformations</title>

    <style>
        .box {
            width: 150px;
            height: 100px;
            background-color: lightblue;
            margin: 30px;
            padding: 20px;
            transition: 1s;
        }

        .box:hover {
            transform: rotate(20deg) scale(1.2);
        }

        .box3d:hover {
            transform: rotateY(180deg);
        }
    </style>
</head>

<body>

    <h2>2D Transformation</h2>
    <div class="box">Hover Me</div>

    <h2>3D Transformation</h2>
    <div class="box box3d">Hover Me</div>

</body>
</html>
