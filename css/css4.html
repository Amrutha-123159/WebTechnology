<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 4</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(780px, 90vw);
      background: white;
      border-radius: 16px;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.1);
      padding: 28px;
    }
    h1 { text-align: center; color: #1d4ed8; }
    .text-demo {
      font-family: Georgia, serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0f172a;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 4</h1>
    <p class="text-demo">Font Properties and Text Formatting</p>
  </div>
</body>
</html>
