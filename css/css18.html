<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 18</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fef3c7;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(700px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(245, 158, 11, 0.12);
      padding: 30px;
      text-align: center;
    }
    h1 { color: #b45309; }
    .box {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      border-radius: 18px;
      margin: 18px auto 0;
      animation: bounce 1.8s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 18</h1>
    <div class="box"></div>
  </div>
</body>
</html>
