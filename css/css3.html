<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 3</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fef2f2, #dbeafe);
      font-family: Arial, sans-serif;
      color: #111827;
    }
    .card {
      width: min(760px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 36px rgba(17, 24, 39, 0.14);
      padding: 30px;
      text-align: center;
    }
    h1 { color: #dc2626; margin-bottom: 16px; }
    .demo {
      padding: 24px;
      border: 3px dashed #2563eb;
      background: linear-gradient(135deg, #dbeafe, #fee2e2);
      border-radius: 14px;
    }
    .text { color: #dc2626; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 3</h1>
    <div class="demo">
      <p class="text">This page demonstrates CSS colors, backgrounds, and borders.</p>
    </div>
  </div>
</body>
</html>
