<!DOCTYPE html>
<html>
<head>
    <title>Restaurant</title>

    <style>
        header {
            background-color: brown;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .food {
            width: 200px;
            padding: 20px;
            background-color: lightyellow;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>Delicious Restaurant</h1>
        <p>Welcome to our restaurant</p>
    </header>

    <div class="menu">

        <div class="food">
            <h3>Pizza</h3>
            <p>₹200</p>
        </div>

        <div class="food">
            <h3>Biryani</h3>
            <p>₹250</p>
        </div>

        <div class="food">
            <h3>Burger</h3>
            <p>₹150</p>
        </div>

    </div>

</body>
</html>
