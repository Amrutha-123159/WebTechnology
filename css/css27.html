<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 27</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef2ff;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(760px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(99, 102, 241, 0.12);
      padding: 28px;
    }
    h1 { text-align: center; color: #4f46e5; }
    p { color: #111827; }
    .box-class { color: #2563eb; font-weight: 700; }
    #box-id { color: #dc2626; font-weight: 700; }
    input[type="text"] { border: 2px solid #a5b4fc; padding: 8px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 27</h1>
    <p>Paragraph element</p>
    <div class="box-class">Class selector</div>
    <div id="box-id">ID selector</div>
    <input type="text" placeholder="Attribute selector" />
  </div>
</body>
</html>
