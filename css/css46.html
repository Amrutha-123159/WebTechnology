<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Cards</title>

    <style>
        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .card {
            width: 200px;
            padding: 20px;
            background-color: lightblue;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Card Layout</h2>

    <div class="container">

        <div class="card">
            <h3>Card 1</h3>
            <p>Welcome to Card 1</p>
        </div>

        <div class="card">
            <h3>Card 2</h3>
            <p>Welcome to Card 2</p>
        </div>

        <div class="card">
            <h3>Card 3</h3>
            <p>Welcome to Card 3</p>
        </div>

    </div>

</body>
</html>
