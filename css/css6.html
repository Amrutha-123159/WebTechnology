<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 6</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eff6ff;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(800px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 35px rgba(37, 99, 235, 0.12);
      padding: 30px;
    }
    h1 { text-align: center; color: #1d4ed8; }
    .box-row {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 22px;
    }
    .fixed, .fluid {
      background: #bfdbfe;
      border: 2px solid #2563eb;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      font-weight: 700;
      color: #1e3a8a;
    }
    .fixed { width: 180px; height: 80px; }
    .fluid { width: 100%; max-width: 260px; height: 80px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 6</h1>
    <div class="box-row">
      <div class="fixed">Fixed width</div>
      <div class="fluid">Fluid width</div>
    </div>
  </div>
</body>
</html>
