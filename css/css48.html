<!DOCTYPE html>
<html>
<head>
    <title>Two Column Layout</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .box {
            padding: 30px;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h2>Two Column Layout</h2>

    <div class="container">
        <div class="box">Column 1</div>
        <div class="box">Column 2</div>
    </div>

</body>
</html>
