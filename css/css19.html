<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 19</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #eff6ff;
    }
    .card {
      width: min(760px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(59, 130, 246, 0.12);
      padding: 24px;
    }
    h1 { text-align: center; color: #1d4ed8; }
    nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    nav a {
      text-decoration: none;
      color: #0f172a;
      background: #dbeafe;
      padding: 10px 14px;
      border-radius: 9px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 19</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Services</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </div>
</body>
</html>
