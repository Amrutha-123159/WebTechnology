<!DOCTYPE html>
<html>
<head>
    <title>Travel Website</title>

    <style>
        header {
            text-align: center;
            padding: 50px;
            background-color: lightblue;
        }

        .places {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .place {
            width: 250px;
            padding: 20px;
            text-align: center;
        }

        img {
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h1>Explore the World</h1>
        <p>Travel and create memories</p>
    </header>

    <div class="places">

        <div class="place">
            <img src="https://picsum.photos/250/150?1">
            <h2>Goa</h2>
        </div>

        <div class="place">
            <img src="https://picsum.photos/250/150?2">
            <h2>Manali</h2>
        </div>

        <div class="place">
            <img src="https://picsum.photos/250/150?3">
            <h2>Kerala</h2>
        </div>

    </div>

</body>
</html>
