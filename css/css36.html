<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 36</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(740px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(15, 23, 42, 0.08);
      padding: 30px;
    }
    h1 { text-align: center; color: #7c3aed; }
    .stack {
      position: relative;
      height: 180px;
      margin-top: 18px;
    }
    .layer {
      position: absolute;
      width: 180px;
      height: 90px;
      display: grid;
      place-items: center;
      font-weight: 700;
      border-radius: 12px;
    }
    .one { left: 30px; top: 20px; background: #a7f3d0; z-index: 1; }
    .two { left: 90px; top: 50px; background: #bfdbfe; z-index: 2; }
    .three { left: 150px; top: 80px; background: #f9a8d4; z-index: 3; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 36</h1>
    <div class="stack">
      <div class="layer one">Layer 1</div>
      <div class="layer two">Layer 2</div>
      <div class="layer three">Layer 3</div>
    </div>
  </div>
</body>
</html>
