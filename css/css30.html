<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 30</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(780px, 90vw);
      background: white;
      border-radius: 20px;
      box-shadow: 0 18px 35px rgba(15, 23, 42, 0.08);
      padding: 30px;
    }
    h1 { text-align: center; color: #1d4ed8; }
    .bg-demo {
      min-height: 220px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 700;
      background: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 30</h1>
    <div class="bg-demo">Background Image</div>
  </div>
</body>
</html>
