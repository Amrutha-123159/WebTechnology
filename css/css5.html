<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 5</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f0fdf4;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(700px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(5, 150, 105, 0.12);
      padding: 30px;
    }
    h1 { text-align: center; color: #059669; }
    .box {
      width: 220px;
      margin: 24px auto;
      padding: 24px;
      border: 10px solid #10b981;
      background: #d1fae5;
      text-align: center;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 5</h1>
    <div class="box">Margin + Border + Padding + Content</div>
  </div>
</body>
</html>
