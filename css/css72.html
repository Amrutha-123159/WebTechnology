<!DOCTYPE html>
<html>
<head>
    <title>Responsive Typography</title>

    <style>
        h1 {
            font-size: 8vw;
        }

        p {
            font-size: 4vw;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 50px;
            }

            p {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Heading</h1>

    <p>This text changes size according to screen size.</p>

</body>
</html>
