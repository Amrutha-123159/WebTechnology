<!DOCTYPE html>
<html>
<head>
    <title>Loading Spinner</title>

    <style>
        .spinner {
            width: 60px;
            height: 60px;
            border: 8px solid lightgray;
            border-top: 8px solid blue;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <h2>Loading...</h2>

    <div class="spinner"></div>

</body>
</html>
