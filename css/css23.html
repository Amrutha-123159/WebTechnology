<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 23</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .product {
      width: 260px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 18px 35px rgba(15, 23, 42, 0.1);
      padding: 14px;
    }
    .image {
      height: 150px;
      border-radius: 12px;
      background: linear-gradient(135deg, #c7d2fe, #bfdbfe);
    }
    h2 { margin: 12px 0 6px; }
    p { color: #374151; margin: 0 0 12px; }
    button {
      width: 100%;
      border: none;
      padding: 10px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="product">
    <div class="image"></div>
    <h2>Smart Watch</h2>
    <p>$199</p>
    <button>Add to Cart</button>
  </div>
</body>
</html>
