<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 10</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ecfeff, #eff6ff);
      color: #0f172a;
    }
    .card {
      width: min(720px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.13);
      padding: 30px;
    }
    h1 {
      text-align: center;
      color: #0f766e;
      margin-bottom: 18px;
    }
    a {
      display: inline-block;
      padding: 12px 18px;
      margin: 8px;
      background: #14b8a6;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover { background: #0f766e; }
    a:focus { outline: 3px solid #ccfbf1; }
    a:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 10</h1>
    <p style="text-align:center; margin:0 0 20px;">This page demonstrates pseudo-classes.</p>
    <div style="text-align:center;">
      <a href="#">Hover Me</a>
      <a href="#">Focus Me</a>
      <a href="#">Click Me</a>
    </div>
  </div>
</body>
</html>
