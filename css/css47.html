<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 10px;
        }

        .sidebar {
            background-color: lightblue;
            padding: 20px;
        }

        .content {
            background-color: lightgray;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h2>Dashboard Layout</h2>

    <div class="dashboard">

        <div class="sidebar">
            <h3>Menu</h3>
            <p>Home</p>
            <p>Profile</p>
            <p>Settings</p>
        </div>

        <div class="content">
            <h3>Dashboard</h3>
            <p>Welcome to the dashboard.</p>
        </div>

    </div>

</body>
</html>
