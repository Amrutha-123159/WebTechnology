<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>

    <style>
        form {
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <h2 align="center">Contact Us</h2>

    <form>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea rows="5" placeholder="Your Message"></textarea>
        <button>Send</button>
    </form>

</body>
</html>
