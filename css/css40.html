<!DOCTYPE html>
<html>
<head>
    <title>Image Hover Effect</title>

    <style>
        img {
            width: 300px;
            transition: 0.5s;
        }

        img:hover {
            transform: scale(1.2);
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <h2>CSS Image Hover Effect</h2>

    <img src="https://picsum.photos/300/200" alt="Image">

</body>
</html>
