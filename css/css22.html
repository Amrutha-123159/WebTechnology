<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Exercise 22</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(420px, 90vw);
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 30px rgba(79, 70, 229, 0.12);
      padding: 30px;
    }
    h1 { text-align: center; color: #4338ca; }
    form {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    input, button {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Exercise 22</h1>
    <form>
      <input type="text" placeholder="Username" />
      <input type="password" placeholder="Password" />
      <button>Login</button>
    </form>
  </div>
</body>
</html>
