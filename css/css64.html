<!DOCTYPE html>
<html>
<head>
    <title>Mobile First</title>

    <style>
        .container {
            display: block;
        }

        .box {
            padding: 30px;
            margin: 10px;
            background-color: lightblue;
        }

        @media (min-width: 768px) {
            .container {
                display: flex;
            }

            .box {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <h2>Mobile First Design</h2>

    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>

</body>
</html>
