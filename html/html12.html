<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Properties</title>
  <style>
    body {
      background: #f8fafc;
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 30px;
    }
    .box {
      width: 300px;
      background: #dbeafe;
      color: #111827;
      border: 3px solid #1d4ed8;
      border-radius: 12px;
      margin: 20px auto;
      padding: 20px;
      text-align: center;
      font-size: 20px;
    }
    #special {
      background: #fee2e2;
      border-color: #dc2626;
      color: #7f1d1d;
    }
    h1 { color: #0f172a; }
    p { color: #374151; }
  </style>
</head>
<body>
  <h1>CSS Selectors and Styling</h1>
  <p>This paragraph uses a tag selector.</p>
  <div class="box">This is a class selector box.</div>
  <div id="special" class="box">This is an ID selector box.</div>
</body>
</html>
