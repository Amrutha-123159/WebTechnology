<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic Elements</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #eef2ff; }
    header, nav, section, article, footer { padding: 20px; margin: 10px; border-radius: 10px; }
    header { background: #312e81; color: white; }
    nav { background: #c7d2fe; }
    section { background: white; }
    article { background: #e0f2fe; }
    footer { background: #1f2937; color: white; }
    a { color: #1d4ed8; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>College Portal</h1>
  </header>

  <nav>
    <a href="#">Home</a> |
    <a href="#">About</a> |
    <a href="#">Courses</a> |
    <a href="#">Contact</a>
  </nav>

  <section>
    <h2>Welcome</h2>
    <article>
      <h3>Latest News</h3>
      <p>Our college is organizing a workshop on digital literacy for all students.</p>
    </article>
    <article>
      <h3>Upcoming Event</h3>
      <p>Tech Fest is scheduled for next month with multiple competitions and guest lectures.</p>
    </article>
  </section>

  <footer>
    <p>&copy; 2026 College Portal</p>
  </footer>
</body>
</html>
