<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Forms</title>
  <style>
    body { font-family: Arial, sans-serif; background: #ecfeff; padding: 30px; }
    form { background: white; max-width: 500px; padding: 25px; border-radius: 12px; }
    input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
    label { font-weight: bold; }
  </style>
</head>
<body>
  <h1>HTML5 Input Types</h1>
  <form>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter email">

    <label for="date">Date:</label>
    <input type="date" id="date" name="date">

    <label for="number">Number:</label>
    <input type="number" id="number" name="number" min="1" max="100">

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter password">

    <button type="submit">Submit</button>
  </form>
</body>
</html>
