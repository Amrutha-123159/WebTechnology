<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internal and External CSS</title>
  <style>
    body {
      background: linear-gradient(135deg, #e0f2fe, #fdf2f8);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .demo {
      border: 2px dashed #2563eb;
      padding: 20px;
      margin: 20px auto;
      background: rgba(255,255,255,0.8);
      max-width: 700px;
    }
    h1 {
      color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card demo">
      <h1>Internal and External CSS</h1>
      <p>This page uses both an external stylesheet and an internal style block.</p>
      <button class="primary-btn">Primary Button</button>
      <button class="secondary-btn" style="margin-left:10px;">Success Button</button>
    </div>
  </div>
</body>
</html>
