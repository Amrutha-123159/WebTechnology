<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Basics</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f8fafc; }
    h1 { color: #1d4ed8; }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <h1>Welcome to My Webpage</h1>
  <h2>Introduction</h2>
  <p>This is a basic HTML page demonstrating headings and paragraphs.</p>
  <p>HTML allows us to structure content in a readable and organized way.<br>
     We can use line breaks to move to the next line.<br>
     This is useful for writing poems, addresses, or simple notes.</p>
</body>
</html>
