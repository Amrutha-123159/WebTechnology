<!DOCTYPE html>
<html>
<body>

<input type="password" id="password">

<button onclick="showHide()">Show / Hide</button>

<script>
function showHide() {
    let password = document.getElementById("password");

    if (password.type == "password")
        password.type = "text";
    else
        password.type = "password";
}
</script>

</body>
</html>
