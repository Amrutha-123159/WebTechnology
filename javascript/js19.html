<!DOCTYPE html>
<html>
<head>
    <title>Objects</title>
</head>
<body>

<script>
    let student = {
        name: "Amrutha",
        age: 18,
        course: "Computer Science"
    };

    document.write("Name = " + student.name + "<br>");

    document.write("Course = " + student.course);
</script>

</body>
</html>
