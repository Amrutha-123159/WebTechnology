<!DOCTYPE html>
<html>
<body>

<h2>Common Elements</h2>

<script>
let a = [1, 2, 3, 4, 5];
let b = [3, 4, 5, 6, 7];

let common = [];

for (let i = 0; i < a.length; i++) {
    if (b.includes(a[i])) {
        common.push(a[i]);
    }
}

document.write("Common Elements: " + common);
</script>

</body>
</html>
