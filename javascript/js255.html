<!DOCTYPE html>
<html>
<head>
    <title>Location Object</title>
</head>
<body>

<h2>Location Object</h2>

<button onclick="showURL()">Show URL</button>

<p id="result"></p>

<script>
function showURL() {

    document.getElementById("result").innerHTML =
        location.href;
}
</script>

</body>
</html>
