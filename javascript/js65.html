<!DOCTYPE html>
<html>
<body>

<h2>Character Frequency</h2>

<script>
let str = "hello";
let frequency = {};

for (let i = 0; i < str.length; i++) {
    let ch = str[i];

    if (frequency[ch]) {
        frequency[ch]++;
    } else {
        frequency[ch] = 1;
    }
}

for (let ch in frequency) {
    document.write(ch + " = " + frequency[ch] + "<br>");
}
</script>

</body>
</html>
