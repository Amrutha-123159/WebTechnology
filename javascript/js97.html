<!DOCTYPE html>
<html>
<body>

<h2>Window Object</h2>

<button onclick="showWindow()">Show Details</button>

<p id="result"></p>

<script>
function showWindow() {

    document.getElementById("result").innerHTML =
        "Width: " + window.innerWidth + "<br>" +
        "Height: " + window.innerHeight;
}
</script>

</body>
</html>
