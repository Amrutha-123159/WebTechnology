<!DOCTYPE html>
<html>
<head>
    <title>Location Object</title>
</head>
<body>

<h2>Location Object</h2>

<button onclick="showLocation()">Show URL</button>

<p id="output"></p>

<script>
function showLocation() {

    document.getElementById("output").innerHTML =
        "Current URL: " + location.href;
}
</script>

</body>
</html>
