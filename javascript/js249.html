<!DOCTYPE html>
<html>
<head>
    <title>setTimeout</title>
</head>
<body>

<h2>setTimeout Example</h2>

<button onclick="start()">Start</button>

<p id="result"></p>

<script>
function start() {

    document.getElementById("result").innerHTML =
        "Please wait...";

    setTimeout(function() {

        document.getElementById("result").innerHTML =
            "3 seconds completed!";

    }, 3000);
}
</script>

</body>
</html>
