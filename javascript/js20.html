<!DOCTYPE html>
<html>
<head>
    <title>Date and Math</title>
</head>
<body>

<script>
    let today = new Date();

    document.write("Today's Date = " + today + "<br><br>");

    document.write("Square Root of 25 = " + Math.sqrt(25) + "<br>");
    document.write("Power = " + Math.pow(2, 3) + "<br>");
    document.write("Random Number = " + Math.random());
</script>

</body>
</html>
