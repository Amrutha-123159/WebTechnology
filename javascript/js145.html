<!DOCTYPE html>
<html>
<body>

<button onclick="toggle()">What is JavaScript?</button>

<p id="answer" style="display:none">
JavaScript is a programming language used to make webpages interactive.
</p>

<script>
function toggle() {
    let x = document.getElementById("answer");

    x.style.display =
        x.style.display == "none" ? "block" : "none";
}
</script>

</body>
</html>
