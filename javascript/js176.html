<!DOCTYPE html>
<html>
<body>

<ul id="list">
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ul>

<script>
document.getElementById("list").onclick = function(event) {

    if (event.target.tagName == "LI") {
        alert("You selected " + event.target.textContent);
    }
};
</script>

</body>
</html>
