<!DOCTYPE html>
<html>
<head>
    <title>ES6 Features</title>
</head>
<body>

<script>

    let name = "Amrutha";

    const age = 18;

    let message = `My name is ${name} and I am ${age} years old.`;

    let student = {
        name: "Amrutha",
        course: "Computer Science"
    };

    let { name: studentName, course } = student;

    document.write(message + "<br>");
    document.write("Name = " + studentName + "<br>");
    document.write("Course = " + course);

</script>

</body>
</html>
