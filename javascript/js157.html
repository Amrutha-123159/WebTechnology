<!DOCTYPE html>
<html>
<body>

<button
onmousedown="down()"
onmouseup="up()">
Press Button
</button>

<p id="result"></p>

<script>
function down() {
    document.getElementById("result").innerHTML =
        "Mouse button pressed";
}

function up() {
    document.getElementById("result").innerHTML =
        "Mouse button released";
}
</script>

</body>
</html>
