<!DOCTYPE html>
<html>
<body>

<input type="password" id="password">

<button onclick="validate()">Check</button>

<p id="result"></p>

<script>
function validate() {

    let password =
        document.getElementById("password").value;

    let pattern =
        /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}$/;

    if (pattern.test(password)) {
        document.getElementById("result").innerHTML =
            "Strong password";
    } else {
        document.getElementById("result").innerHTML =
            "Use 8+ characters, uppercase, lowercase and number";
    }
}
</script>

</body>
</html>
