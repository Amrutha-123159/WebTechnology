<!DOCTYPE html>
<html>
<body>

<h2>Perfect Number</h2>

<script>
let num = 28;
let sum = 0;

for (let i = 1; i < num; i++) {
    if (num % i == 0) {
        sum = sum + i;
    }
}

if (sum == num) {
    document.write(num + " is a Perfect Number");
} else {
    document.write(num + " is not a Perfect Number");
}
</script>

</body>
</html>
