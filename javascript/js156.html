<!DOCTYPE html>
<html>
<body>

<h2 id="text"
onmouseover="over()"
onmouseout="out()">
Move mouse here
</h2>

<script>
function over() {
    document.getElementById("text").style.color = "red";
}

function out() {
    document.getElementById("text").style.color = "black";
}
</script>

</body>
</html>
