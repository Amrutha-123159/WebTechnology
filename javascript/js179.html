<!DOCTYPE html>
<html>
<body>

<div id="box"
style="width:50px;height:50px;background:blue;position:relative">
</div>

<script>
let position = 0;

document.addEventListener("keydown", function(event) {

    if (event.key == "ArrowRight") {
        position += 10;
    }

    if (event.key == "ArrowLeft") {
        position -= 10;
    }

    document.getElementById("box").style.left =
        position + "px";
});
</script>

</body>
</html>
