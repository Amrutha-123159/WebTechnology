<!DOCTYPE html>
<html>
<head>
    <title>Marks Calculator</title>
</head>
<body>

<h2>Student Marks Calculator</h2>

Maths:
<input type="number" id="maths"><br><br>

Science:
<input type="number" id="science"><br><br>

English:
<input type="number" id="english"><br><br>

<button onclick="calculate()">Calculate</button>

<p id="result"></p>

<script>
function calculate() {

    let maths = Number(document.getElementById("maths").value);
    let science = Number(document.getElementById("science").value);
    let english = Number(document.getElementById("english").value);

    let total = maths + science + english;
    let average = total / 3;

    let grade;

    if (average >= 90)
        grade = "A";
    else if (average >= 75)
        grade = "B";
    else if (average >= 60)
        grade = "C";
    else if (average >= 40)
        grade = "D";
    else
        grade = "F";

    document.getElementById("result").innerHTML =
        "Total: " + total +
        "<br>Average: " + average.toFixed(2) +
        "<br>Grade: " + grade;
}
</script>

</body>
</html>
