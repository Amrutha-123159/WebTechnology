<!DOCTYPE html>
<html>
<body>

<h2>Countdown Timer</h2>

<h1 id="timer">10</h1>

<button onclick="start()">Start</button>

<script>
let count = 10;

function start() {

    let timer = setInterval(function() {

        document.getElementById("timer").innerHTML = count;

        count--;

        if (count < 0) {
            clearInterval(timer);
            document.getElementById("timer").innerHTML =
                "Time Over!";
        }

    }, 1000);
}
</script>

</body>
</html>
