<!DOCTYPE html>
<html>
<body>

<div
onmousemove="move(event)"
style="width:300px;height:200px;border:1px solid black">

Move mouse here

</div>

<p id="result"></p>

<script>
function move(event) {
    document.getElementById("result").innerHTML =
        "X: " + event.clientX +
        " Y: " + event.clientY;
}
</script>

</body>
</html>
