<!DOCTYPE html>
<html>
<head>
    <title>Window Object</title>
</head>
<body>

<h2>Window Object</h2>

<button onclick="showWindow()">Show Details</button>

<p id="result"></p>

<script>
function showWindow() {

    document.getElementById("result").innerHTML =
        "Window Width: " + window.innerWidth +
        "<br>Window Height: " + window.innerHeight;
}
</script>

</body>
</html>
