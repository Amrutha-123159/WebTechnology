<!DOCTYPE html>
<html>
<head>
    <title>Countdown Timer</title>
</head>
<body>

<h1 id="timer">10</h1>

<script>
    let count = 10;

    let timer = setInterval(function() {

        count--;

        document.getElementById("timer").innerHTML =
            count;

        if (count == 0) {
            clearInterval(timer);
            document.getElementById("timer").innerHTML =
                "Time Over!";
        }

    }, 1000);
</script>

</body>
</html>
