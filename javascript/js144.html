<!DOCTYPE html>
<html>
<body>

<p id="content">This is some content.</p>

<button onclick="showHide()">Show / Hide</button>

<script>
function showHide() {
    let x = document.getElementById("content");

    if (x.style.display == "none")
        x.style.display = "block";
    else
        x.style.display = "none";
}
</script>

</body>
</html>
