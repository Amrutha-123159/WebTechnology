<!DOCTYPE html>
<html>
<head>
    <title>Prime Number</title>
</head>
<body>

<script>
    let num = 17;
    let prime = true;

    if (num < 2) {
        prime = false;
    }

    for (let i = 2; i < num; i++) {
        if (num % i == 0) {
            prime = false;
            break;
        }
    }

    if (prime) {
        document.write(num + " is a Prime Number");
    } else {
        document.write(num + " is Not a Prime Number");
    }
</script>

</body>
</html>
