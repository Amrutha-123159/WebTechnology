<!DOCTYPE html>
<html>
<body>

<div id="parent">
    Parent
    <button id="child">Child</button>
</div>

<script>
document.getElementById("parent").addEventListener(
    "click",
    function() {
        alert("Parent capturing");
    },
    true
);

document.getElementById("child").addEventListener(
    "click",
    function() {
        alert("Child");
    }
);
</script>

</body>
</html>
