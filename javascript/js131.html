<!DOCTYPE html>
<html>
<body>

<img id="image"
src="https://via.placeholder.com/200"
width="200">

<br><br>

<button onclick="changeImage()">Change Image</button>

<script>
function changeImage() {
    document.getElementById("image").setAttribute(
        "src",
        "https://via.placeholder.com/300"
    );
}
</script>

</body>
</html>
