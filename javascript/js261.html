<!DOCTYPE html>
<html>
<head>
    <title>Browser Information</title>
</head>
<body>

<h2>Browser Information</h2>

<p id="result"></p>

<script>
document.getElementById("result").innerHTML =
    "User Agent: " + navigator.userAgent +
    "<br>Language: " + navigator.language +
    "<br>Platform: " + navigator.platform;
</script>

</body>
</html>
