<!DOCTYPE html>
<html>
<body>

<textarea id="text" oninput="count()"></textarea>

<p>Characters: <span id="count">0</span></p>

<script>
function count() {
    let text = document.getElementById("text").value;

    document.getElementById("count").textContent =
        text.length;
}
</script>

</body>
</html>
