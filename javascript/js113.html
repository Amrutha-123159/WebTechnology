<!DOCTYPE html>
<html>
<body>

<h2>Tic-Tac-Toe</h2>

<button onclick="play(0)">-</button>
<button onclick="play(1)">-</button>
<button onclick="play(2)">-</button>
<br>
<button onclick="play(3)">-</button>
<button onclick="play(4)">-</button>
<button onclick="play(5)">-</button>
<br>
<button onclick="play(6)">-</button>
<button onclick="play(7)">-</button>
<button onclick="play(8)">-</button>

<p id="result">Player X's turn</p>

<script>
let board = ["", "", "", "", "", "", "", ""];
let player = "X";

function play(index) {
    if (board[index] == "") {
        board[index] = player;
        event.target.innerHTML = player;

        if (checkWinner()) {
            document.getElementById("result").innerHTML =
                "Player " + player + " wins!";
            return;
        }

        player = player == "X" ? "O" : "X";

        document.getElementById("result").innerHTML =
            "Player " + player + "'s turn";
    }
}

function checkWinner() {
    let combinations = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
    ];

    for (let c of combinations) {
        if (board[c[0]] &&
            board[c[0]] == board[c[1]] &&
            board[c[1]] == board[c[2]]) {
            return true;
        }
    }

    return false;
}
</script>

</body>
</html>
