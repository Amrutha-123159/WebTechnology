<!DOCTYPE html>
<html>
<body>

<h2>Armstrong Number</h2>

<script>
let num = 153;
let temp = num;
let sum = 0;

while (temp > 0) {
    let digit = temp % 10;
    sum = sum + digit * digit * digit;
    temp = Math.floor(temp / 10);
}

if (sum == num) {
    document.write(num + " is an Armstrong number");
} else {
    document.write(num + " is not an Armstrong number");
}
</script>

</body>
</html>
