<!DOCTYPE html>
<html>
<body>

<h2>Shopping Cart</h2>

<button onclick="add('Laptop', 50000)">Laptop ₹50000</button>
<button onclick="add('Phone', 20000)">Phone ₹20000</button>
<button onclick="add('Mouse', 500)">Mouse ₹500</button>

<ul id="cart"></ul>

<h3>Total: ₹<span id="total">0</span></h3>

<script>
let total = 0;

function add(name, price) {
    let li = document.createElement("li");

    li.innerHTML = name + " - ₹" + price;

    document.getElementById("cart").appendChild(li);

    total += price;

    document.getElementById("total").innerHTML = total;
}
</script>

</body>
</html>
