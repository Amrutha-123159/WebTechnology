<!DOCTYPE html>
<html>
<body>

<table border="1" id="table">
<tr>
    <th>Name</th>
    <th>Marks</th>
</tr>
</table>

<script>
let students = [
    ["Amrutha", 90],
    ["Rahul", 85],
    ["Priya", 95]
];

students.forEach(function(student) {
    let row = document.getElementById("table").insertRow();

    row.insertCell(0).textContent = student[0];
    row.insertCell(1).textContent = student[1];
});
</script>

</body>
</html>
